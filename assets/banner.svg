<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Subtle Dynamic CSS Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    .glowing-orb { animation: pulseGlow 6s infinite ease-in-out; transform-origin: center; }
    .data-stream { stroke-dasharray: 20, 10; animation: dashMove 20s linear infinite; }
    .floating-bg { animation: floatCard 8s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Animated Ambient Glows (Background Layer) -->
  <circle cx="200" cy="100" r="180" fill="#0284c7" opacity="0.15" class="glowing-orb" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="220" fill="#6366f1" opacity="0.15" class="glowing-orb" filter="url(#glow)" />

  <!-- Animated Data Connection Lines -->
  <path d="M 50 320 Q 300 280 600 340 T 1150 300" fill="none" stroke="url(#pulseLine)" stroke-width="2" class="data-stream" opacity="0.6" />
  <path d="M 100 80 Q 400 140 800 60 T 1100 120" fill="none" stroke="url(#pulseLine)" stroke-width="1.5" class="data-stream" opacity="0.4" />

  <!-- Datacenter Server Rack Visual Element -->
  <g transform="translate(850, 70)" opacity="0.35" class="floating-bg">
    <rect x="0" y="0" width="260" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="20" y1="40" x2="240" y2="40" stroke="#1e293b" stroke-width="20" rx="4" />
    <circle cx="35" cy="40" r="4" fill="#10b981" />
    <circle cx="50" cy="40" r="4" fill="#38bdf8" />
    
    <line x1="20" y1="80" x2="240" y2="80" stroke="#1e293b" stroke-width="20" rx="4" />
    <circle cx="35" cy="80" r="4" fill="#10b981" />
    <circle cx="50" cy="80" r="4" fill="#6366f1" />

    <line x1="20" y1="120" x2="240" y2="120" stroke="#1e293b" stroke-width="20" rx="4" />
    <circle cx="35" cy="120" r="4" fill="#f59e0b" />
    <circle cx="50" cy="120" r="4" fill="#10b981" />

    <line x1="20" y1="160" x2="240" y2="160" stroke="#1e293b" stroke-width="20" rx="4" />
    <circle cx="35" cy="160" r="4" fill="#10b981" />

    <line x1="20" y1="200" x2="240" y2="200" stroke="#1e293b" stroke-width="20" rx="4" />
    <circle cx="35" cy="200" r="4" fill="#10b981" />
    <circle cx="50" cy="200" r="4" fill="#38bdf8" />
  </g>

  <!-- Main Content Foreground (Guaranteed Unobscured Layer) -->
  <g transform="translate(80, 75)">
    <rect width="320" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="20" y="23" class="badge-text">⚡ DCIM • Orchestration • Observability</text>
  </g>

  <text x="80" y="170" class="title" filter="url(#glow)">Awesome Datacenter</text>
  <text x="80" y="225" class="title" filter="url(#glow)">Management Suite 🚀</text>
  
  <text x="80" y="280" class="subtitle">Curated Commercial Platforms &amp; Open-Source Production Infrastructure</text>

  <rect x="80" y="320" width="400" height="4" rx="2" fill="url(#titleGrad)" />
</svg>
